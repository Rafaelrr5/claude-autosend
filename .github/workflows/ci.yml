name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # package.json declares os: ["win32"], which npm enforces on the root
      # package too, so a plain `npm ci` fails on the Linux runner. --force
      # skips that platform check. Only express is installed and it is
      # platform-agnostic; the win32 guard that matters is in server.js.
      - run: npm ci --force
      - run: npm run check
      - run: npm test
